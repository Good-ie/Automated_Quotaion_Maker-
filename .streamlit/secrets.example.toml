# Copy the [database] values from Supabase: Project > Connect > "Session pooler".
# On Streamlit Community Cloud paste this (with real values) into
# App settings > Secrets. Never commit a file with the real password.

[database]
host = "aws-0-REGION.pooler.supabase.com"
port = 5432
user = "postgres.YOURPROJECTREF"
password = "YOUR-DATABASE-PASSWORD"
dbname = "postgres"

[app]
# Needed once, to create the first (admin) account online. Any long random phrase.
setup_key = "CHOOSE-A-LONG-SECRET-PHRASE"
